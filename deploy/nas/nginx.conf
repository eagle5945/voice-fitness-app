# Brute-force guard for the backup token: 10 requests a minute. Behind Funnel every request shares one address, so this is a global limit.
limit_req_zone $binary_remote_addr zone=backup:1m rate=10r/m;

server {
    listen 127.0.0.1:18085;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Security headers live only here. nginx drops server-level add_header in any location that has its own,
    # so locations below set caching with `expires` instead of add_header.
    # Only this site's own files may load or run; no inline scripts or style attributes, no framing by other sites.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    # Funnel serves this site only over HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ~ \.mjs$ {
        types { text/javascript mjs; }
        try_files $uri =404;
        expires -1;
    }

    # Only the NAS backup server is exposed; every other /api/ path stays closed. The server itself sends Cache-Control: no-store.
    location ^~ /api/backup/ {
        limit_req zone=backup burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:18086;
        proxy_set_header Host $host;
    }

    location ^~ /api/ { return 404; }

    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }
}
