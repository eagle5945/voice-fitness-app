# Brute-force guard for the backup token: 10 requests a minute per client.
limit_req_zone $binary_remote_addr zone=backup:1m rate=10r/m;

server {
    listen 127.0.0.1:18085;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;

    location ~ \.mjs$ {
        types { text/javascript mjs; }
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Only the NAS backup server is exposed; every other /api/ path stays closed.
    location ^~ /api/backup/ {
        limit_req zone=backup burst=5 nodelay;
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:18086;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /api/ { return 404; }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
