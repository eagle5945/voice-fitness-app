<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Voice Fitness · Neon Pulse 시안</title><style>
:root{--bg:#080b10;--card:#141a22;--green:#b5ff45;--blue:#398bff;--text:#f3f6fa;--muted:#98a4b5;--line:#242e3b;color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text)}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;color:inherit}button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:5px}h1,h2,h3,p{margin:0}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.stage{min-height:100vh;display:grid;grid-template-columns:290px 390px;justify-content:center;align-items:center;gap:85px;padding:24px;background:radial-gradient(ellipse at 68% 45%,#14221d50,transparent 47%)}aside .label{color:var(--green);font:11px Consolas,monospace;letter-spacing:2px}aside h1{font-family:"Arial Narrow","Segoe UI",sans-serif;font-weight:800;font-size:66px;line-height:.97;letter-spacing:-3px;margin:25px 0}aside h1 span{color:var(--green)}aside p{font-size:14px;color:var(--muted);line-height:1.9;word-break:keep-all}.swatches{display:flex;gap:9px;margin:25px 0}.swatches i{height:8px;width:45px;background:var(--green)}.swatches i:nth-child(2){background:var(--blue)}.swatches i:nth-child(3){background:var(--card)}aside ol{font-size:13px;line-height:2.3;color:var(--muted);padding-left:18px;margin:26px 0}aside footer{font-size:11px;color:var(--muted);line-height:1.8;border-top:1px solid var(--line);padding-top:20px}aside a{color:var(--blue);display:inline-block;margin-top:17px;font-size:12px;text-decoration:none;padding:10px 0}.phone{height:min(850px,calc(100dvh - 48px));border:6px solid #1d242d;border-radius:39px;overflow:hidden;background:var(--bg);box-shadow:0 35px 100px #0009,0 0 0 1px #394351;display:flex;flex-direction:column;position:relative}.status{display:flex;justify-content:space-between;padding:12px 23px 0;font:600 11px "Segoe UI",sans-serif;height:33px}.brand{display:flex;justify-content:space-between;align-items:center;padding:17px 22px 12px}.brand b{font-size:14px;letter-spacing:-.3px;display:flex;gap:9px;align-items:center}.logo{background:var(--green);color:#101607;font-style:italic;padding:5px 8px;border-radius:8px;font-weight:900}.preview{font:9px Consolas,monospace;color:var(--muted);border:1px solid var(--line);padding:6px;border-radius:5px}main{padding:9px 21px 25px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#33412c transparent;flex:1;min-height:0}.between{display:flex;align-items:center;justify-content:space-between;gap:10px}.eyebrow{font-size:10px;color:var(--muted);letter-spacing:1px}.live{font-size:10px;color:var(--green);display:flex;gap:6px;align-items:center}.live:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--green)}h2{font-size:28px;letter-spacing:-1px;margin:11px 0 7px}h3{font-size:14px;letter-spacing:-.3px}.sub{font-size:11px;color:var(--muted);line-height:1.8}.progress{display:flex;gap:5px;margin:18px 0}.progress i{height:3px;flex:1;border-radius:4px;background:#28313c}.progress i.done{background:var(--green)}.target{background:linear-gradient(125deg,#1b252a,#121820);border:1px solid #2a373e;border-radius:19px;padding:17px 19px}.badge{font:10px Consolas,monospace;color:var(--green);background:#b5ff4510;padding:6px 8px;border:1px solid #b5ff4530;border-radius:6px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:14px}.metrics>div+div{border-left:1px solid #34404b;padding-left:22px}.metrics small{font-size:10px;color:var(--muted);display:block;margin-bottom:4px}.metrics b{font:650 48px "Segoe UI",sans-serif;letter-spacing:-2px;line-height:1.15}.metrics em{font-size:13px;color:var(--muted);font-style:normal;margin-left:5px}.voice{display:grid;justify-items:center;padding:18px 0 12px;position:relative}.voice:before{content:"";position:absolute;width:220px;height:220px;top:7px;pointer-events:none;background:radial-gradient(circle,#b5ff450d,transparent 68%)}.voice-label{font:10px Consolas,monospace;letter-spacing:2px;color:var(--green);margin-bottom:14px}.mic-ring{border:1px solid #b5ff4526;border-radius:50%;padding:11px;box-shadow:0 0 30px #b5ff4508}.mic{height:100px;width:100px;border:1px solid #deffa5;border-radius:50%;background:var(--green);color:#101a04;display:grid;place-items:center;box-shadow:0 0 25px #b5ff4540,0 0 70px #b5ff4515,inset 0 2px 5px #fff8;position:relative}.mic svg{width:39px;height:39px;stroke-width:1.8}.mic[aria-pressed="true"]{animation:breathe 1.8s ease-in-out infinite}.voice-hint{font-size:12px;margin-top:15px}.wave{width:100%;height:49px;margin:5px 0;display:block}.demo-hint{font-size:10px;color:var(--muted);text-align:center;line-height:1.6}.section-head{display:flex;justify-content:space-between;align-items:center;margin:17px 0 12px}.text{background:none;border:0;color:var(--blue);font-size:11px;min-height:40px;padding:8px}.set-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}.set-row>span:first-child{color:var(--muted);font:11px Consolas,monospace;min-width:38px}.set-row b{flex:1;font:600 16px "Segoe UI",sans-serif}.check{color:var(--green);font-size:11px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:17px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px}.stat small{display:block;color:var(--muted);font-size:10px;margin-bottom:8px}.stat b{font:600 25px "Segoe UI",sans-serif;letter-spacing:-.5px}.stat em{font-size:10px;font-style:normal;color:var(--muted);margin-left:5px}.stat.blue b{color:var(--blue)}.nav{display:flex;border-top:1px solid var(--line);background:#0d1118;padding:10px 12px 17px;flex-shrink:0}.nav button{flex:1;display:grid;justify-items:center;gap:5px;border:0;background:none;color:var(--muted);font-size:10px;min-height:44px;padding:4px}.nav button.on{color:var(--green)}.nav svg{height:20px;width:20px}.routine{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:18px 0}.routine h3{font-size:24px;margin:14px 0 7px}.routine p{font-size:12px;color:var(--muted);line-height:1.9}.primary{border:0;background:var(--green);color:#111c06;border-radius:12px;padding:14px 17px;min-height:48px;width:100%;font-weight:700;font-size:13px;margin-top:17px}.secondary{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;min-height:46px;width:100%;font-size:13px;padding:12px;margin-top:9px}.week{height:145px;display:flex;align-items:end;gap:15px;padding:10px 4px;margin-bottom:22px}.day{flex:1;display:grid;justify-items:center;gap:9px;font:10px Consolas,monospace;color:var(--muted)}.bar{width:100%;background:#398bff50;border-radius:5px 5px 0 0;min-height:4px}.day:last-child .bar{background:var(--green);box-shadow:0 0 16px #b5ff4518}.notice{font-size:11px;color:var(--muted);line-height:1.7;padding:14px;border:1px dashed #394453;border-radius:12px;margin:20px 0}.confirm{border:1px solid #398bff70;background:#398bff10;padding:16px;border-radius:16px;margin-top:14px}.confirm p{font-size:12px;line-height:1.8}.confirm strong{font-size:24px;display:block;margin:8px 0}.confirm .primary{margin-top:12px}.feedback{color:var(--green);font-size:12px;padding:12px 0}a:focus-visible{outline-offset:4px}[hidden]{display:none!important}@keyframes breathe{50%{box-shadow:0 0 40px #b5ff4560,0 0 90px #b5ff4525}}@media(max-width:760px){.stage{display:block;padding:0;min-height:100dvh}aside{display:none}.phone{max-width:440px;margin:auto;height:100dvh;border:0;border-radius:0;box-shadow:none}.status{display:none}.brand{padding-top:calc(20px + env(safe-area-inset-top))}.nav{padding-bottom:calc(12px + env(safe-area-inset-bottom))}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"><defs><symbol id="mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M6 10v2a6 6 0 0 0 12 0v-2m-6 8v4m-3 0h6"/></symbol><symbol id="grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol><symbol id="chart" viewBox="0 0 24 24"><path d="M4 4v16h17M9 15v-4m5 4V6m5 9v-6"/></symbol><symbol id="weight" viewBox="0 0 24 24"><path d="M8 12h8M3 9v6m3-9v12m12-12v12m3-9v6M3 12h3m12 0h3"/></symbol></defs></svg>
<div class="stage"><aside><div class="label">VOICE FITNESS / CONCEPT 02</div><h1>TRAIN.<br>SPEAK.<br><span>REPEAT.</span></h1><p>운동의 리듬을 끊지 않는 기록.<br>목소리를 중심으로 설계한<br>네온 피트니스 인터페이스.</p><div class="swatches" aria-label="네온 그린, 일렉트릭 블루, 차콜"><i></i><i></i><i></i></div><ol><li>마이크를 눌러 파형 시연 시작</li><li>다시 누르면 예시 전사문 확인</li><li>기록 저장 후 운동량 변화 확인</li></ol><footer>인터랙티브 디자인 시안 · 실제 녹음 없음<br>음성 파형과 전사 결과는 시뮬레이션입니다.<br>기존 앱과 운동 기록은 변경되지 않습니다.</footer><a href="pastel-interface-preview.html">← 이전 파스텔 시안 비교</a></aside>
<div class="phone"><div class="status" aria-hidden="true"><span>9:41</span><span>▮▮▮ &nbsp; ◒ &nbsp; ▰</span></div><header class="brand"><b><span class="logo">V</span>VOICE FITNESS</b><span class="preview">DESIGN PREVIEW</span></header><main id="screen"></main><nav class="nav" aria-label="주 메뉴"><button data-view="workout"><svg><use href="#weight"/></svg>운동</button><button data-view="routines"><svg><use href="#grid"/></svg>루틴</button><button data-view="history"><svg><use href="#chart"/></svg>기록</button></nav></div></div>
<script>
const screen=document.querySelector('#screen');const icon=n=>`<svg aria-hidden="true"><use href="#${n}"/></svg>`;
const plans=[{name:'가슴',exercise:'벤치프레스',weight:70,reps:10,desc:'벤치프레스 · 인클라인 덤벨프레스 · 케이블 플라이'},{name:'등',exercise:'랫풀다운',weight:40,reps:12,desc:'랫풀다운 · 시티드 로우 · 원암 덤벨로우'},{name:'하체',exercise:'바벨스쿼트',weight:20,reps:15,desc:'바벨스쿼트 · 레그프레스 · 레그컬'}];
let view='workout',chosen=0,recording=false,pending=false,saved=false,sets=[[70,10],[70,10]],frame;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function totals(){return sets.reduce((n,s)=>n+s[0]*s[1],0)}
function render(){cancelAnimationFrame(frame);let p=plans[chosen];document.querySelectorAll('.nav button').forEach(b=>{let on=b.dataset.view===view;b.classList.toggle('on',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});if(view==='workout')screen.innerHTML=`<div class="between"><span class="eyebrow">${p.name} 루틴 · 1/3 종목</span><span class="live">WORKOUT</span></div><h2>${p.exercise}</h2><p class="sub">힘껏 움직이고, 가볍게 기록하세요.</p><div class="progress" aria-label="예시 ${sets.length}세트 기록">${Array.from({length:9},(_,i)=>`<i class="${i<sets.length?'done':''}"></i>`).join('')}</div><section class="target"><div class="between"><span class="badge">SET ${String(sets.length+1).padStart(2,'0')}</span><span class="sub">목표 3세트${sets.length>=3?' · 추가 기록':''}</span></div><div class="metrics"><div><small>중량</small><b>${p.weight}</b><em>kg</em></div><div><small>목표 횟수</small><b>${p.reps}</b><em>회</em></div></div></section><section class="voice"><span class="voice-label">${recording?'LISTENING · DEMO':'VOICE INPUT'}</span><div class="mic-ring"><button class="mic" id="mic-button" aria-label="${recording?'음성 시연 종료':'음성 시연 시작'}" aria-pressed="${recording}">${icon('mic')}</button></div><p class="voice-hint">${recording?'말하는 중… 다시 눌러 완료':'세트가 끝나면, 눌러서 말하세요'}</p><canvas class="wave" width="620" height="98" aria-label="${recording?'시뮬레이션 음성 파형':'음성 입력 대기 파형'}"></canvas><p class="demo-hint">${recording?'실제 녹음 없이 파형을 시연하고 있어요.':`“${p.weight}킬로 ${p.reps}회” · 마이크는 디자인 시연용입니다.`}</p></section>${pending?`<section class="confirm" role="status"><p>예시 전사문 · 확인 후 기록</p><strong>${p.weight}kg × ${p.reps}회</strong><p>실제로 인식한 음성이 아닌 시연 결과입니다.</p><button class="primary" id="save">이 세트 기록</button><button class="secondary" id="cancel">취소</button></section>`:''}${saved?'<p class="feedback" role="status">✓ 예시 세트를 기록했어요.</p>':''}<div class="section-head"><h3>오늘의 세트</h3><span class="sub">${sets.length}세트 완료</span></div>${sets.map((s,i)=>`<div class="set-row"><span>0${i+1}세트</span><b>${s[0]} kg <span class="sub">×</span> ${s[1]} 회</b><span class="check">✓ 완료</span></div>`).join('')||'<p class="sub">첫 세트를 기록해보세요.</p>'}<div class="stats"><div class="stat"><small>오늘의 운동량</small><b>${totals().toLocaleString()}</b><em>kg</em></div><div class="stat blue"><small>누적 반복</small><b>${sets.reduce((n,s)=>n+s[1],0)}</b><em>회</em></div></div>`;
else if(view==='routines')screen.innerHTML=`<span class="eyebrow">MY TRAINING PLAN</span><h2>오늘의 집중 부위.</h2><p class="sub">준비된 루틴을 고르고 운동을 시작하세요.</p>${plans.map((p,i)=>`<section class="routine"><span class="badge">3 EXERCISES / 9 SETS</span><h3>${p.name}</h3><p>${p.desc}</p><button class="primary" data-plan="${i}">이 루틴으로 시작 →</button></section>`).join('')}<p class="notice">예시 루틴입니다. 선택하면 현재 시연 기록이 초기화됩니다.</p>`;
else screen.innerHTML=`<span class="eyebrow">YOUR PROGRESS</span><h2>기록이 만드는 변화.</h2><p class="sub">이번 주 운동 현황 · 예시 데이터</p><div class="stats"><div class="stat"><small>이번 주 운동</small><b>4</b><em>회</em></div><div class="stat blue"><small>이번 주 세트</small><b>${27+sets.length}</b><em>세트</em></div></div><section class="routine"><div class="between"><h3>일별 완료 세트</h3><span class="badge">THIS WEEK</span></div><div class="week" role="img" aria-label="예시 주간 세트: 월9, 화0, 수9, 목0, 금9, 토 ${sets.length}">${['MON','TUE','WED','THU','FRI','SAT'].map((d,i)=>`<div class="day"><span>${i===5?sets.length:i%2===0?9:0}</span><div class="bar" style="height:${i===5?Math.min(sets.length*9,81):i%2===0?81:4}px"></div><span>${d}</span></div>`).join('')}</div></section><div class="section-head"><h3>오늘 · ${p.name} 루틴</h3><span class="sub">시연 기록</span></div>${sets.map((s,i)=>`<div class="set-row"><span>0${i+1}</span><b>${s[0]} kg × ${s[1]} 회</b><span class="check">✓</span></div>`).join('')}<p class="notice">이 화면은 디자인 확인용입니다. 실제 운동 데이터와 연결되어 있지 않으며 새로고침하면 초기화됩니다.</p>`;
if(view==='workout')draw();}
function draw(t=0){const c=document.querySelector('.wave');if(!c)return;const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);const bars=57,gap=10,start=(c.width-(bars-1)*gap)/2;for(let i=0;i<bars;i++){const envelope=Math.sin(Math.PI*i/(bars-1));const pulse=recording?(0.35+0.65*Math.abs(Math.sin(i*1.71+t/190))):0.15;const h=4+envelope*pulse*65;ctx.fillStyle=i<bars/2?'#398bff':'#b5ff45';ctx.globalAlpha=recording?0.85:0.38;ctx.beginPath();ctx.roundRect(start+i*gap,49-h/2,3,h,2);ctx.fill()}if(recording&&!reduced)frame=requestAnimationFrame(draw)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){recording=false;view=b.dataset.view;render();screen.scrollTop=0}if(b.dataset.plan!==undefined){chosen=+b.dataset.plan;sets=[];recording=false;pending=false;saved=false;view='workout';render();screen.scrollTop=0}if(b.id==='mic-button'){recording=!recording;pending=!recording;saved=false;const top=screen.scrollTop;render();screen.scrollTop=top;if(pending)document.querySelector('.confirm').scrollIntoView({block:'nearest',behavior:'instant'})}if(b.id==='save'){sets.push([plans[chosen].weight,plans[chosen].reps]);pending=false;saved=true;const top=screen.scrollTop;render();screen.scrollTop=top}if(b.id==='cancel'){pending=false;render()}});render();
</script></body></html>
