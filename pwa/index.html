<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="세트가 끝나면 말하거나 직접 입력하는 개인용 운동 기록">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="preload" href="./fonts/VFSans-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./styles.css">
  <title>운동 기록</title>
</head>
<body>
  <a class="skip-link" href="#app-main">본문으로 건너뛰기</a>
  <div class="app-shell">
    <nav class="app-nav" aria-label="주 메뉴">
      <div class="nav-brand" aria-hidden="true"><span class="brand-mark">V</span><span>운동 기록</span></div>
      <button type="button" data-view="home" id="nav-home"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>오늘</span></button>
      <button type="button" data-view="routines" id="nav-routines"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M13 5h8"/><path d="M13 12h8"/><path d="M13 19h8"/><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/></svg><span>루틴</span></button>
      <button type="button" data-view="history" id="nav-history"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg><span>기록</span></button>
    </nav>
    <div class="app-body">
      <header class="app-header">
        <div class="header-brand"><span class="brand-mark" aria-hidden="true">V</span><span class="header-title">운동 기록</span></div>
        <span id="connection" class="connection" aria-live="polite"></span>
      </header>
      <main id="app-main" class="app-main" tabindex="-1" aria-busy="true">
        <div class="skeleton-page" role="status" aria-label="기록을 불러오는 중">
          <div class="skeleton sk-eyebrow"></div>
          <div class="skeleton sk-title"></div>
          <div class="skeleton sk-card"></div>
          <div class="skeleton sk-card short"></div>
        </div>
      </main>
    </div>
  </div>
  <div id="toast-region" class="toast-region"></div>

  <dialog id="confirm-dialog" class="dialog confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <form method="dialog" class="sheet">
      <div class="confirm-head"><span class="confirm-icon"></span><h2 id="confirm-title" class="dialog-title"></h2></div>
      <p id="confirm-message" class="confirm-message"></p>
      <div class="button-row"><button value="cancel" id="confirm-cancel" class="button secondary">취소</button><button value="ok" id="confirm-ok" class="button primary">확인</button></div>
    </form>
  </dialog>

  <dialog id="set-dialog" class="dialog" aria-labelledby="set-dialog-title">
    <form id="set-form" class="sheet" method="dialog">
      <h2 id="set-dialog-title" class="dialog-title">세트 직접 입력</h2>
      <div class="field-grid">
        <label class="field"><span class="label">중량 (kg)</span><input id="set-weight" name="weight" inputmode="decimal" type="number" min="0" max="2000" step="0.5" required></label>
        <label class="field"><span class="label">실제 횟수</span><input id="set-reps" name="reps" inputmode="numeric" type="number" min="0" max="999" step="1" required></label>
      </div>
      <p class="meta">목표 횟수가 아니라 실제로 수행한 횟수를 입력하세요.</p>
      <p id="set-error" class="inline-error" role="alert" hidden></p>
      <div class="button-row"><button type="button" class="button secondary" id="set-cancel">닫기</button><button type="submit" class="button primary">저장</button></div>
      <button type="button" class="button danger full" id="set-delete" hidden>이 세트 취소</button>
    </form>
  </dialog>

  <dialog id="dictation-dialog" class="dialog" aria-labelledby="dictation-title">
    <form id="dictation-form" class="sheet">
      <div class="sheet-heading"><p class="eyebrow">세트 기록</p><h2 id="dictation-title" class="dialog-title">받아쓰기로 기록</h2></div>
      <p id="dictation-help" class="meta">키보드의 마이크를 누르고 “70킬로 20회”처럼 말하세요. 받아쓰기를 마친 뒤 문장을 확인합니다.</p>
      <label class="field" for="dictation-text"><span class="label">받아쓴 문장</span></label>
      <textarea id="dictation-text" rows="3" lang="ko" inputmode="text" maxlength="300" placeholder="예: 70킬로 20회" aria-describedby="dictation-help dictation-weight-hint"></textarea>
      <p id="dictation-weight-hint" class="meta"></p>
      <div id="dictation-feedback" role="status" aria-live="polite" hidden></div>
      <button id="dictation-save" type="button" class="button primary full" hidden>기록 저장</button>
      <div class="button-row"><button id="dictation-cancel" type="button" class="button secondary">닫기</button><button id="dictation-check" type="submit" class="button primary">입력 확인</button></div>
      <details class="disclosure"><summary><span>키보드에 마이크가 없나요?</span><svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6"/></svg></summary><div class="disclosure-body"><p class="meta">iPhone 설정 → 일반 → 키보드에서 받아쓰기를 켜고 한국어 키보드를 선택하세요. 문장을 직접 입력해도 됩니다.</p></div></details>
    </form>
  </dialog>

  <dialog id="routine-dialog" class="dialog dialog-wide" aria-labelledby="routine-title">
    <form id="routine-form" class="sheet">
      <div class="sheet-heading"><p class="eyebrow">루틴</p><h2 id="routine-title" class="dialog-title">새 운동 루틴</h2><p class="meta">위에서부터 순서대로 운동을 안내합니다.</p></div>
      <label class="field"><span class="label">루틴 제목</span><input name="title" required maxlength="40" placeholder="예: 하체"></label>
      <div id="routine-exercises" class="routine-exercises"></div>
      <button type="button" class="button secondary full" id="add-routine-exercise"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14"/><path d="M12 5v14"/></svg>운동 추가</button>
      <p id="routine-error" class="inline-error" role="alert" hidden></p>
      <div class="button-row sheet-footer"><button type="button" class="button secondary" id="routine-cancel">취소</button><button type="submit" class="button primary">루틴 저장</button></div>
    </form>
  </dialog>
  <dialog id="recommend-dialog" class="dialog dialog-wide" aria-labelledby="recommend-title">
    <div id="recommend-body" class="sheet"></div>
  </dialog>
  <input id="backup-file" class="sr-only" type="file" accept=".json,application/json">
  <script type="module" src="./app.mjs?v=20261002-38"></script>
</body>
</html>
