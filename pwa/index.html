<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="세트가 끝나면 말하거나 직접 입력하는 개인용 운동 기록">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./neon.css">
  <title>운동 기록</title>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand-mark" aria-hidden="true">V</div>
      <div><span class="app-kicker">VOICE FITNESS</span><h1>운동 기록</h1></div>
      <span id="connection" class="connection" aria-live="polite"></span>
    </header>
    <main id="app-main" tabindex="-1"></main>
    <nav class="tabbar" aria-label="주 메뉴">
      <button type="button" data-view="home" id="nav-home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10H3zM9 20v-7h6v7"/></svg><span>오늘</span></button>
      <button type="button" data-view="routines" id="nav-routines"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>루틴</span></button>
      <button type="button" data-view="history" id="nav-history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10m8 10V4m8 16v-7"/></svg><span>기록</span></button>
    </nav>
  </div>
  <dialog id="set-dialog" aria-labelledby="set-dialog-title">
    <form id="set-form" class="sheet" method="dialog">
      <h2 id="set-dialog-title">세트 직접 입력</h2>
      <div class="field-grid">
        <label>중량 · kg<input id="set-weight" name="weight" inputmode="decimal" type="number" min="0" max="2000" step="0.5" required></label>
        <label>실제 횟수<input id="set-reps" name="reps" inputmode="numeric" type="number" min="0" max="999" step="1" required></label>
      </div>
      <p class="hint">목표 횟수 대신 실제 수행한 횟수를 기록합니다.</p>
      <p id="set-error" class="inline-error" role="alert" hidden></p>
      <div class="button-row"><button type="button" class="button secondary" id="set-cancel">닫기</button><button type="submit" class="button primary">저장</button></div>
      <button type="button" class="button secondary full" id="set-delete" hidden>이 세트 취소</button>
    </form>
  </dialog>
  <dialog id="dictation-dialog" aria-labelledby="dictation-title">
    <form id="dictation-form" class="sheet">
      <div class="sheet-heading"><span class="eyebrow">세트 기록</span><h2 id="dictation-title">말해서 간편하게</h2></div>
      <p id="dictation-help" class="hint">키보드 마이크를 누르고 “70킬로 20회”처럼 말해주세요. 받아쓰기를 끝내고 문장을 확인하세요.</p>
      <label class="field" for="dictation-text">받아쓴 문장</label>
      <textarea id="dictation-text" rows="3" lang="ko" inputmode="text" maxlength="300" placeholder="예: 70킬로 20회" aria-describedby="dictation-help dictation-weight-hint"></textarea>
      <p id="dictation-weight-hint" class="hint"></p>
      <div id="dictation-feedback" role="status" aria-live="polite" hidden></div>
      <button id="dictation-save" type="button" class="button primary full" hidden>기록 저장</button>
      <div class="button-row"><button id="dictation-cancel" type="button" class="button secondary">닫기</button><button id="dictation-check" type="submit" class="button primary">입력 확인</button></div>
      <details><summary>키보드에 마이크가 없나요?</summary><p class="hint">iPhone 설정 → 일반 → 키보드 → 받아쓰기 활성화를 확인하세요. 한국어 키보드를 선택하세요. 문장을 직접 타이핑해도 사용할 수 있습니다.</p></details>
    </form>
  </dialog>
  <dialog id="routine-dialog" aria-labelledby="routine-title">
    <form id="routine-form" class="sheet">
      <div class="sheet-heading"><span class="eyebrow">나의 운동 계획</span><h2 id="routine-title">새 운동 루틴</h2><p class="hint">위에서부터 순서대로 운동을 안내해요.</p></div>
      <label class="field">루틴 제목<input name="title" required maxlength="40" placeholder="예: 하체"></label>
      <div id="routine-exercises" class="routine-exercises"></div>
      <button type="button" class="button secondary full dashed-button" id="add-routine-exercise">＋ 운동 추가</button>
      <p id="routine-error" class="inline-error" role="alert" hidden></p>
      <div class="button-row sheet-footer"><button type="button" class="button secondary" id="routine-cancel">취소</button><button type="submit" class="button primary">루틴 저장</button></div>
    </form>
  </dialog>
  <input id="backup-file" class="sr-only" type="file" accept=".json,application/json">
  <script type="module" src="./app.mjs?v=20261001-25"></script>
</body>
</html>
